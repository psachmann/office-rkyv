syntax = "proto3";

option csharp_namespace = "OfficeRkyv.Contracts.Users";

package users;

import "google/protobuf/empty.proto";
import "user_queries.proto";

// Write side of the user feature.
service UserCommands {
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser (DeleteUserRequest) returns (google.protobuf.Empty);
}

message CreateUserRequest {
  string email = 1;
  string display_name = 2;
}

// Commands return the resulting user so the client can seed its query cache from the mutation
// response, and so it has the new version to send back as expected_version on the next write.
message CreateUserResponse {
  UserDto user = 1;
}

message UpdateUserRequest {
  string user_id = 1;
  int32 version = 2;
  string display_name = 3;
}

message UpdateUserResponse {
  UserDto user = 1;
}

message DeleteUserRequest {
  string user_id = 1;
  int32 version = 2;
}

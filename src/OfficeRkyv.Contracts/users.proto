syntax = "proto3";

option csharp_namespace = "OfficeRkyv.Contracts.Users";

package users;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// Resource-oriented user API. The command/query split is an internal concern of the server.
service UsersService {
  rpc ListUsers (ListUsersRequest) returns (ListUsersResponse);
  rpc FindUserByEmail (FindUserByEmailRequest) returns (FindUserByEmailResponse);
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser (DeleteUserRequest) returns (google.protobuf.Empty);
}

message UserDto {
  string id = 1;
  string email = 2;
  string display_name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  int32 version = 6;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated UserDto users = 1;
}

message FindUserByEmailRequest {
  string email = 1;
}

message FindUserByEmailResponse {
  // Unset when no user with the given email exists.
  optional UserDto user = 1;
}

message CreateUserRequest {
  string email = 1;
  string display_name = 2;
}

// Mutations return the resulting user so the client can seed its query cache from the mutation
// response, and so it has the new version to send back as expected_version on the next write.
message CreateUserResponse {
  UserDto user = 1;
}

message UpdateUserRequest {
  string user_id = 1;
  int32 version = 2;
  string display_name = 3;
}

message UpdateUserResponse {
  UserDto user = 1;
}

message DeleteUserRequest {
  string user_id = 1;
  int32 version = 2;
}

syntax = "proto3";

option csharp_namespace = "OfficeRkyv.Contracts.Documents";

package documents;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// Resource-oriented document API: a document is one immutable file and its metadata. The command/query split
// is an internal concern of the server.
service DocumentsService {
  rpc ListInbox (ListInboxRequest) returns (ListInboxResponse);
  rpc ListArchiveDocuments (ListArchiveDocumentsRequest) returns (ListArchiveDocumentsResponse);
  rpc SearchDocuments (SearchDocumentsRequest) returns (SearchDocumentsResponse);
  rpc UploadDocument (stream UploadDocumentRequest) returns (UploadDocumentResponse);
  rpc DownloadDocument (DownloadDocumentRequest) returns (stream DownloadDocumentResponse);
  rpc RenameDocument (RenameDocumentRequest) returns (RenameDocumentResponse);
  rpc DeleteDocument (DeleteDocumentRequest) returns (google.protobuf.Empty);
  rpc FileDocument (FileDocumentRequest) returns (FileDocumentResponse);
  rpc UnfileDocument (UnfileDocumentRequest) returns (UnfileDocumentResponse);
}

message DocumentDto {
  string id = 1;
  string owner_id = 2;
  string title = 3;
  // Unset means the document is in its owner's inbox.
  optional string archive_id = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  int32 version = 7;
  // The file, fixed at creation. The content itself is fetched with DownloadDocument.
  string file_name = 8;
  string content_type = 9;
  // In bytes.
  int64 size = 10;
  // SHA-256 of the content, lowercase hex.
  string sha256 = 11;
}

// Lists the caller's non-deleted documents that are in no archive.
message ListInboxRequest {
  reserved 1;
  reserved "owner_id";
}

message ListInboxResponse {
  repeated DocumentDto documents = 1;
}

// Lists the non-deleted documents in the caller's archive; an empty, deleted or unknown archive, or one that belongs
// to another user, yields an empty list.
message ListArchiveDocumentsRequest {
  string archive_id = 1;
}

message ListArchiveDocumentsResponse {
  repeated DocumentDto documents = 1;
}

// Finds the caller's non-deleted documents, in the inbox and in every archive, whose title or file name contains
// every word of the query, best match first. A word matches anywhere inside a title or a file name, ignoring case.
// Words of fewer than 3 characters are ignored; a query with no word left is INVALID_ARGUMENT on `query` with the
// reason `too_short`, and one over 200 characters is `too_long`.
message SearchDocumentsRequest {
  reserved 1;
  reserved "owner_id";
  string query = 2;
}

// At most 50 documents; `has_more` says that more matched than were returned.
message SearchDocumentsResponse {
  repeated DocumentDto documents = 1;
  bool has_more = 2;
}

// Mutations return the resulting document so the client can seed its query cache from the response,
// and so it has the new version to send back on the next write.

message RenameDocumentRequest {
  string document_id = 1;
  int32 version = 2;
  string title = 3;
}

message RenameDocumentResponse {
  DocumentDto document = 1;
}

message DeleteDocumentRequest {
  string document_id = 1;
  int32 version = 2;
}

// Files the caller's document into one of the caller's archives, from the inbox or from another archive. A document
// or archive of another user is NOT_FOUND, as an unknown one.
message FileDocumentRequest {
  string document_id = 1;
  int32 version = 2;
  string archive_id = 3;
}

message FileDocumentResponse {
  DocumentDto document = 1;
}

// Returns the caller's document to their inbox.
message UnfileDocumentRequest {
  string document_id = 1;
  int32 version = 2;
}

message UnfileDocumentResponse {
  DocumentDto document = 1;
}

// A new document always starts in the caller's inbox. An upload is one header followed by the content in chunks, in
// chunks well below the message size limit; the header must come first. The response is the created document.
message UploadDocumentRequest {
  oneof payload {
    UploadDocumentHeader header = 1;
    bytes chunk = 2;
  }
}

message UploadDocumentHeader {
  reserved 1;
  reserved "owner_id";
  string file_name = 2;
  // As the client declared it; empty means none was declared.
  string content_type = 3;
  // Unset means the server derives the title from the file name.
  optional string title = 4;
}

message UploadDocumentResponse {
  DocumentDto document = 1;
}

message DownloadDocumentRequest {
  string document_id = 1;
}

message DownloadDocumentResponse {
  bytes chunk = 1;
}

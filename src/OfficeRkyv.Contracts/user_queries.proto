syntax = "proto3";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "OfficeRkyv.Contracts.Users";

package users;

// Read side of the user feature.
service UserQueries {
  rpc FindAllUsers (FindAllUsersRequest) returns (FindAllUsersResponse);
  rpc FindUserByEmail (FindUserByEmailRequest) returns (FindUserByEmailResponse);
}

message UserDto {
  string id = 1;
  string email = 2;
  string display_name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  int32 version = 6;
}

message FindAllUsersRequest {}

message FindAllUsersResponse {
  repeated UserDto users = 1;
}

message FindUserByEmailRequest {
  string email = 1;
}

message FindUserByEmailResponse {
  // Unset when no user with the given email exists.
  optional UserDto user = 1;
}

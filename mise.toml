[tools]
dotnet = "10"

[tasks.setup]
description = "One-time setup: restore .NET tools, build, and download Playwright's browsers"
# The Playwright CLI finds the browser version from the functional tests project, so it runs from that folder.
run = [
  "dotnet tool restore",
  "dotnet build",
  "(cd tests/OfficeRkyv.FunctionalTests && dotnet playwright install chromium)",
]

[tasks.update]
description = "Updates dotnet tools and dependencies for the entire project"
run = [
  "dotnet tool update --framework 10.0 --all",
  "dotnet outdated --upgrade:Auto --maximum-version 10.0",
]

[tasks.dev]
description = "Start the whole app (API, web UI, dependencies) via the Aspire AppHost"
run = "dotnet aspire run"

[tasks.format]
description = "Format all C# sources with CSharpier"
run = "dotnet csharpier format ."

[tasks.build]
description = "Build the solution in the given configuration (e.g. Debug, Release)"
usage = 'arg "[config]" help="Build configuration" default="Debug"'
run = 'dotnet build --configuration ${usage_config?}'

[tasks.test]
description = "Run all tests in the given configuration (e.g. Debug, Release)"
usage = 'arg "[config]" help="Build configuration" default="Debug"'
run = 'dotnet test --configuration ${usage_config?}'

[tasks.desktop]
description = "Run the standalone Linux desktop app (needs GTK4 and WebKitGTK installed)"
run = 'DOTNET_ENVIRONMENT=${DOTNET_ENVIRONMENT:-Development} dotnet run --project src/OfficeRkyv.Desktop'
